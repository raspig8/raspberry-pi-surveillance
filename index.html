<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raspberry Pi Surveillance & Audio</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;background:#f4f4f9;color:#1d2939;margin:30px 0}
.container{display:flex;flex-direction:column;align-items:center;gap:15px}
h3{color:#172b45;border-bottom:2px solid #d6dee8;padding-bottom:10px;margin:20px 0 0}
.status{padding:8px 15px;border-radius:5px;background:#eee;font-size:14px;max-width:95vw}
.alert{background:#fde2e1;color:#b42318;font-weight:bold}
.video-container{width:640px;max-width:95vw;background:#101820;border-radius:8px;overflow:hidden}
video{display:block;width:100%;min-height:220px;max-height:560px;object-fit:contain}
.driver-selector{display:flex;align-items:center;gap:8px;padding:8px;color:#fff}
button{padding:12px 24px;font-size:16px;font-weight:bold;color:#fff;background:#337ab7;border:none;border-radius:5px;cursor:pointer}
#talkButton{background:#d9534f}
button.on,#talkButton.on{background:#28a745}
button:disabled,#talkButton:disabled{background:#777;cursor:not-allowed}
#logoutButton{padding:4px 10px;font-size:13px;margin-left:8px;background:#5b6573}
#login{position:fixed;inset:0;z-index:9;display:flex;justify-content:center;align-items:center;background:#101827;color:#fff}
#login form{width:350px;max-width:90%;padding:30px;border-radius:12px;background:#1e293b}
#login input,#login button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0}
#loginError{color:#f87171;min-height:1em}
</style>
</head>
<body>

<div id="login">
    <form id="loginForm">
        <h2>Police Officer Login</h2>
        <p>Emergency Surveillance System</p>
        <input id="username" placeholder="Enter username" autocomplete="username" required>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
        <button type="submit">Login</button>
        <p id="loginError"></p>
    </form>
</div>

<div class="container">
    <div class="status"><span id="officerInfo">Not logged in</span><button id="logoutButton">Logout</button></div>

    <h3>Live Raspberry Pi Stream</h3>
    <div id="sosStatus" class="status">No active SOS</div>

    <div class="video-container">
        <div class="driver-selector">
            <label for="driverSelect">SOS Emergency Driver:</label>
            <select id="driverSelect"><option value="">No active SOS</option></select>
        </div>
        <video id="cameraVideo" autoplay playsinline controls></video>
    </div>
    <div id="cameraStatus" class="status">Camera disconnected</div>

    <button id="listenButton" disabled>Enable Pi Microphone</button>
    <audio id="piAudio" autoplay playsinline></audio>
    <button id="talkButton" disabled>Click to Talk to Pi</button>

    <!-- GOOGLE MAPS - DO NOT CHANGE -->
    <div class="map-box">
        <h3 class="section-heading">Device Location</h3>

        <iframe
            id="gps-map"
            src="https://www.google.com/maps?q=13.916045,121.141089&output=embed"
            width="640"
            height="250"
            style="border:0; max-width:100%;"
            allowfullscreen
            loading="lazy">
        </iframe>

        <p id="gps-status">Waiting for GPS location...</p>
    </div>
</div>

<script>
// Cloudflare tunnel to server.py on the Pi (cloudflared tunnel --url http://localhost:5000)
const PI_API_URL = "https://cheap-warm-composer-greg.trycloudflare.com";
// Cloudflare tunnel to MediaMTX (camera / mic / talk-back)
const CLOUDFLARE_URL = "https://preliminary-developmental-given-dem.trycloudflare.com";
// Current addresses. They switch automatically if the Pi restarts a tunnel.
let piApi = PI_API_URL, mediaUrl = CLOUDFLARE_URL, lastUrlCheck = 0;
const POLL_MS = 1000;
const MAP_REFRESH_MS = 5000;

const $ = id => document.getElementById(id);
const driverSelect = $("driverSelect"), cameraVideo = $("cameraVideo"), cameraStatus = $("cameraStatus");
const sosStatus = $("sosStatus"), piAudio = $("piAudio"), listenButton = $("listenButton");
const talkButton = $("talkButton"), gpsMap = $("gps-map"), gpsStatus = $("gps-status");

let token = localStorage.getItem("piToken");
let sos = { state: "none" };
let pollTimer = null, polling = false, accepting = false;
let cameraPC = null, piMicPC = null, talkPC = null, localMicStream = null;
let cameraStarting = false, cameraRequestId = 0, cameraRetryTimer = null;
let lastMapKey = "", lastMapUpdate = 0, holdUntil = 0;

/* ---------------- Pi API ---------------- */
async function api(path, options = {}) {
    const headers = { "Content-Type": "application/json" };
    if (token) headers.Authorization = "Bearer " + token;
    let res;
    try {
        res = await fetch(piApi + path, { ...options, headers, cache: "no-store", signal: AbortSignal.timeout(8000) });
    } catch {
        throw new Error("Raspberry Pi server is unreachable");
    }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== "/login") showLogin("Session expired. Please log in again.");
    if (!res.ok) throw new Error(data.error || "Pi server returned HTTP " + res.status);
    return data;
}

/* ---------------- Login ---------------- */
$("loginForm").onsubmit = async e => {
    e.preventDefault();
    $("loginError").textContent = "Logging in...";
    try {
        const data = await api("/login", {
            method: "POST",
            body: JSON.stringify({ username: $("username").value, password: $("password").value })
        });
        token = data.token;
        localStorage.setItem("piToken", token);
        $("password").value = "";
        $("officerInfo").textContent = "Logged in: " + data.station;
        startDashboard();
    } catch (err) {
        $("loginError").textContent = err.message;
    }
};

$("logoutButton").onclick = async () => {
    await api("/logout", { method: "POST" }).catch(() => {});
    showLogin("");
};

function showLogin(message) {
    token = null;
    localStorage.removeItem("piToken");
    clearInterval(pollTimer);
    pollTimer = null;
    endSosMedia();
    sos = { state: "none" };
    render();
    $("login").style.display = "flex";
    $("loginError").textContent = message || "";
}

function startDashboard() {
    $("login").style.display = "none";
    if (!pollTimer) {
        poll();
        pollTimer = setInterval(poll, POLL_MS);
    }
}

/* ---------------- SOS polling ---------------- */
async function poll() {
    if (polling || !token) return;
    polling = true;
    try {
        const data = await api("/status");
        const prev = sos;
        sos = data.sos || { state: "none" };
        $("officerInfo").textContent = "Logged in: " + data.station;

        if (sos.state === "offered" && (prev.state !== "offered" || prev.id !== sos.id)) notify(sos.reason);
        if (prev.state === "accepted" && sos.state !== "accepted") endSosMedia();
        if (prev.state !== "accepted" && sos.state === "accepted") startCamera();
        if (prev.state === "offered" && sos.state === "none" && !accepting) {
            flash("SOS passed to the next station (not accepted in time).");
        }
        render();
    } catch (err) {
        if (token) sosStatus.textContent = "Connection problem: " + err.message;
        refreshUrls();
    } finally {
        polling = false;
    }
}

/* If the Pi restarted a tunnel, Vercel soon serves this page with new addresses.
   Read them from the live page and switch without logging the officer out. */
async function refreshUrls() {
    if (Date.now() - lastUrlCheck < 10000) return;
    lastUrlCheck = Date.now();
    try {
        const html = await (await fetch(location.pathname, { cache: "no-store" })).text();
        const grab = name => (html.match(new RegExp(name + '\\s*=\\s*"(https://[^"]+)"')) || [])[1];
        const api = grab("PI_API_URL"), media = grab("CLOUDFLARE_URL");
        if (!api || !media || (api === piApi && media === mediaUrl)) return;
        piApi = api;
        mediaUrl = media;
        console.log("Raspberry Pi addresses changed:", api, media);
        flash("Reconnected to the Raspberry Pi at its new address.");
        // Running video/audio does not use the tunnel, so leave it alone.
        // Only start the camera again if it is not connected.
        if (sos.state === "accepted" && !cameraPC) startCamera();
    } catch (err) {
        console.error("Address check failed:", err);
    }
}

function flash(message) {
    sosStatus.textContent = message;
    holdUntil = Date.now() + 5000;
}

function render() {
    const active = sos.state !== "none";
    let option = driverSelect.querySelector('option[value="driver1"]');

    if (active && !option) {
        driverSelect.add(new Option("Driver 1", "driver1"));
        driverSelect.options[0].textContent = "Select a driver";
    }
    if (!active && option) {
        option.remove();
        driverSelect.options[0].textContent = "No active SOS";
    }
    if (!active) driverSelect.value = "";
    if (sos.state === "accepted") driverSelect.value = "driver1";

    sosStatus.classList.toggle("alert", sos.state === "offered");
    if (sos.state === "offered") {
        sosStatus.textContent = `SOS! Select "Driver 1" within ${sos.expiresIn}s to accept.`;
    } else if (sos.state === "accepted") {
        sosStatus.textContent = "You accepted this SOS. Reason: " + (sos.reason || "not given") +
            '. Change the dropdown back to "Select a driver" when it is resolved.';
    } else if (Date.now() > holdUntil) {
        sosStatus.textContent = "No active SOS";
    }

    const accepted = sos.state === "accepted";
    if (!piMicPC) listenButton.disabled = !accepted;
    if (!talkPC) talkButton.disabled = !accepted;
    updateMap(accepted ? sos.location : null);
}

function notify(reason) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    try {
        new Notification("SOS — Helmet Emergency", {
            body: (reason || "An incident has been detected.") + ' Select "Driver 1" within 15 seconds to accept.',
            tag: "helmet-sos-incident",
            requireInteraction: true
        });
    } catch (err) {
        console.error("Notification failed:", err);
    }
}

/* ---------------- Dropdown: select = accept, deselect = resolve ---------------- */
driverSelect.onchange = async () => {
    if (driverSelect.value !== "driver1") return resolveSos();
    if (sos.state !== "offered" || accepting) return;

    accepting = true;
    sosStatus.textContent = "Accepting SOS...";
    try {
        await api("/accept", { method: "POST", body: JSON.stringify({ sosId: sos.id }) });
        sos.state = "accepted";
        render();
        startCamera();
    } catch (err) {
        driverSelect.value = "";
        flash("Could not accept: " + err.message);
    } finally {
        accepting = false;
    }
};

async function resolveSos() {
    if (sos.state !== "accepted") return;
    try {
        await api("/resolve", { method: "POST", body: JSON.stringify({ sosId: sos.id }) });
        endSosMedia();
        sos = { state: "none" };
        render();
        flash("SOS resolved.");
    } catch (err) {
        driverSelect.value = "driver1";
        flash("Could not resolve: " + err.message);
    }
}

/* ---------------- GPS map (accepting officer only) ---------------- */
function updateMap(loc) {
    if (sos.state !== "accepted") {
        gpsStatus.textContent = "GPS is shown only to the station handling the SOS.";
        return;
    }
    if (!loc || !Number.isFinite(loc.latitude) || !Number.isFinite(loc.longitude)) {
        gpsStatus.textContent = "Waiting for a GPS fix from the helmet...";
        return;
    }
    const key = loc.latitude.toFixed(6) + "," + loc.longitude.toFixed(6);
    gpsStatus.textContent = "Location: " + key.replace(",", ", ");
    if (key !== lastMapKey && Date.now() - lastMapUpdate >= MAP_REFRESH_MS) {
        gpsMap.src = "https://www.google.com/maps?q=" + key + "&output=embed";
        lastMapKey = key;
        lastMapUpdate = Date.now();
    }
}

/* ---------------- WebRTC helpers ---------------- */
async function createTurnPeerConnection() {
    const res = await fetch("/api/ice");
    if (!res.ok) throw new Error("Failed to obtain TURN credentials");
    const data = await res.json();
    if (!Array.isArray(data.iceServers)) throw new Error("Invalid TURN credentials response");
    return new RTCPeerConnection({ iceServers: data.iceServers });
}

function waitForICE(pc, ms = 5000) {
    return new Promise(resolve => {
        if (pc.iceGatheringState === "complete") return resolve();
        const timer = setTimeout(resolve, ms);
        pc.addEventListener("icegatheringstatechange", () => {
            if (pc.iceGatheringState === "complete") { clearTimeout(timer); resolve(); }
        });
    });
}

async function negotiate(pc, url) {
    await pc.setLocalDescription(await pc.createOffer());
    await waitForICE(pc);
    const res = await fetch(url, {
        method: "POST",
        // MediaMTX asks server.py whether this officer may access the stream.
        headers: { "Content-Type": "application/sdp", "Authorization": "Basic " + btoa("officer:" + token) },
        body: pc.localDescription.sdp,
        signal: AbortSignal.timeout(10000)
    });
    if (!res.ok) throw new Error(`${url} returned ${res.status}: ${await res.text()}`);
    await pc.setRemoteDescription({ type: "answer", sdp: await res.text() });
}

async function connectWHEP(path, kind, onTrack) {
    const pc = await createTurnPeerConnection();
    try {
        pc.ontrack = onTrack;
        pc.addTransceiver(kind, { direction: "recvonly" });
        await negotiate(pc, `${mediaUrl}${path}/whep`);
        return pc;
    } catch (err) {
        pc.close();
        throw err;
    }
}

/* ---------------- Camera ---------------- */
async function startCamera() {
    if (cameraStarting || cameraPC) return;
    if (sos.state !== "accepted") {
        cameraStatus.textContent = "Accept the SOS to view the camera";
        return;
    }
    cameraStarting = true;
    const id = ++cameraRequestId;
    try {
        cameraStatus.textContent = "Connecting to camera...";
        const pc = await connectWHEP("/cam", "video", e => {
            if (id !== cameraRequestId) return;
            cameraVideo.srcObject = e.streams[0] || new MediaStream([e.track]);
            cameraVideo.play().catch(() => cameraStatus.textContent = "Connected, but video playback failed");
        });
        if (id !== cameraRequestId) return pc.close();
        pc.onconnectionstatechange = () => {
            if (cameraPC === pc && ["failed", "closed"].includes(pc.connectionState)) {
                stopCamera();
                retryCamera("Camera connection lost");
            }
        };
        cameraPC = pc;
        cameraStatus.textContent = "Camera connected";
    } catch (err) {
        if (id === cameraRequestId) {
            console.error("Camera connection failed:", err);
            retryCamera("Camera connection failed: " + err.message);
        }
    } finally {
        cameraStarting = false;
    }
}

function retryCamera(message) {
    refreshUrls();
    cameraStatus.textContent = message + ". Retrying in 5 s...";
    clearTimeout(cameraRetryTimer);
    cameraRetryTimer = setTimeout(() => { if (sos.state === "accepted") startCamera(); }, 5000);
}

function stopCamera() {
    clearTimeout(cameraRetryTimer);
    cameraRequestId++;
    if (cameraPC) { cameraPC.close(); cameraPC = null; }
    cameraVideo.srcObject = null;
    cameraStatus.textContent = "Camera disconnected";
}

/* ---------------- Pi microphone -> website ---------------- */
listenButton.onclick = async () => {
    if (piMicPC) return stopPiMicrophone();
    if (sos.state !== "accepted") return;
    listenButton.disabled = true;
    listenButton.textContent = "Connecting...";
    try {
        const pc = await connectWHEP("/mic", "audio", e => {
            piAudio.srcObject = e.streams[0];
            piAudio.play().catch(err => console.log("Audio playback blocked:", err));
        });
        pc.onconnectionstatechange = () => {
            if (piMicPC === pc && ["failed", "closed"].includes(pc.connectionState)) {
                stopPiMicrophone();
                listenButton.textContent = "Pi Microphone Disconnected";
                setTimeout(() => { if (!piMicPC) listenButton.textContent = "Enable Pi Microphone"; }, 3000);
            }
        };
        piMicPC = pc;
        listenButton.textContent = "Stop Pi Microphone";
        listenButton.classList.add("on");
    } catch (err) {
        console.error("Pi microphone connection failed:", err);
        stopPiMicrophone();
        listenButton.textContent = "Pi Microphone Failed";
    } finally {
        listenButton.disabled = sos.state !== "accepted";
    }
};

function stopPiMicrophone() {
    if (piMicPC) { piMicPC.close(); piMicPC = null; }
    piAudio.srcObject = null;
    listenButton.textContent = "Enable Pi Microphone";
    listenButton.classList.remove("on");
}

/* ---------------- Website microphone -> Pi speaker ---------------- */
talkButton.onclick = async () => {
    if (talkPC) return stopTalking();
    if (sos.state !== "accepted") return;
    talkButton.disabled = true;
    talkButton.textContent = "Connecting...";
    try {
        if (!localMicStream) {
            localMicStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });
        }
        talkPC = await createTurnPeerConnection();
        localMicStream.getTracks().forEach(t => talkPC.addTrack(t, localMicStream));
        const pc = talkPC;
        pc.onconnectionstatechange = () => {
            if (talkPC === pc && ["failed", "closed"].includes(pc.connectionState)) {
                stopTalking();
                talkButton.textContent = "Talk Disconnected";
                setTimeout(() => { if (!talkPC) talkButton.textContent = "Click to Talk to Pi"; }, 3000);
            }
        };
        await negotiate(talkPC, `${mediaUrl}/from_pc/whip`);
        talkButton.textContent = "Stop Talking";
        talkButton.classList.add("on");
    } catch (err) {
        console.error("Talk connection failed:", err);
        stopTalking();
        talkButton.textContent = err.name === "NotAllowedError" ? "Microphone Blocked" : "Connection Failed";
        setTimeout(() => { if (!talkPC) talkButton.textContent = "Click to Talk to Pi"; }, 3000);
    } finally {
        talkButton.disabled = sos.state !== "accepted";
    }
};

function stopTalking() {
    if (talkPC) { talkPC.close(); talkPC = null; }
    talkButton.textContent = "Click to Talk to Pi";
    talkButton.classList.remove("on");
}

/* ---------------- Start / cleanup ---------------- */
function endSosMedia() {
    stopCamera();
    stopPiMicrophone();
    stopTalking();
}

if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission().catch(err => console.error("Notification permission error:", err));
}

if (token) startDashboard();

window.addEventListener("beforeunload", () => {
    endSosMedia();
    if (localMicStream) localMicStream.getTracks().forEach(t => t.stop());
});
</script>
</body>
</html>
