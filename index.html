/* =========================================

:root {

    border-bottom: 2px solid var(--border-color);

}



/* SOS driver selection panel */

    display: flex;

    gap: 9px;

<script>
async function updateGPSMap() {
    const status = document.getElementById("gps-status");
    const map = document.getElementById("gps-map");

    try {
        const response = await fetch("/api/location", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("API returned HTTP " + response.status);
        }

        const data = await response.json();

        // Support the API response format:
        // { success: true, location: { latitude, longitude } }
        const location = data.location || data;

        if (
            !location ||
            !Number.isFinite(Number(location.latitude)) ||
            !Number.isFinite(Number(location.longitude))
        ) {
            throw new Error("GPS coordinates are missing or invalid");
        }

        const latitude = Number(location.latitude);
        const longitude = Number(location.longitude);

        map.src =
            "https://www.google.com/maps?q=" +
            latitude + "," + longitude + "&output=embed";

        status.textContent =
            "Location: " + latitude.toFixed(6) + ", " +
            longitude.toFixed(6);

    } catch (error) {
        status.textContent = "Unable to retrieve GPS location: " + error.message;
        console.error("GPS map update failed:", error);
    }
}

updateGPSMap();
setInterval(updateGPSMap, 5000);
</script>
<script>
/*
 * SOS BROWSER NOTIFICATIONS
 * Polls /api/incident and notifies on a new inactive -> active transition.
 */
(() => {
    const notificationButton = document.getElementById("notificationButton");
    const notificationStatus = document.getElementById("notificationStatus");

    let lastIncidentActive = null;
    let checkingIncident = false;

async function updateNotificationButton() {
    if (!("Notification" in window)) {
        console.log("This browser does not support notifications.");
        return;
    }

    if (Notification.permission === "granted") {
        console.log("SOS browser notifications are enabled.");
        return;
    }

    if (Notification.permission === "denied") {
        console.log("Notifications are blocked in browser settings.");
        return;
    }

    try {
        const permission = await Notification.requestPermission();

        if (permission === "granted") {
            console.log("SOS browser notifications are enabled.");
        } else {
            console.log("SOS notification permission was not granted.");
        }
    } catch (error) {
        console.error("Notification permission request failed:", error);
    }
}



    async function checkIncidentStatus() {
        if (checkingIncident) return;
        checkingIncident = true;

        try {
            const response = await fetch("/api/incident", {
                method: "GET",
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("Incident API returned HTTP " + response.status);
            }

            const incident = await response.json();
            const isActive = incident.active === true;

            
            updateDriverDropdown(isActive);

            if (!isActive && (cameraPC || cameraStartInProgress)) {
                stopCamera();
            }

            
            if (isActive) {
                if (!cameraPC && !cameraStartInProgress) {
                    startCamera();
                }
            } else {
                if (cameraPC || cameraStartInProgress) {
                    stopCamera();
                }
            }


            // Establish a baseline on page load to avoid a duplicate alert
            // just because the dashboard opened during an existing incident.
            if (lastIncidentActive === null) {
                lastIncidentActive = isActive;
                return;
            }

            if (!lastIncidentActive && isActive) {
                if ("Notification" in window &&
                    Notification.permission === "granted") {
                    const reason = typeof incident.reason === "string" &&
                        incident.reason.trim()
                        ? "Reason: " + incident.reason.trim()
                        : "An incident has been detected.";

                    new Notification("SOS — Helmet Emergency", {
                        body: reason + " Open your dashboard to check the GPS location and live camera.",
                        tag: "helmet-sos-incident",
                        requireInteraction: true
                    });
                } else {
                    console.warn(
                        "SOS incident detected, but browser notifications are not enabled."
                    );
                }
            }

            lastIncidentActive = isActive;
        } catch (error) {
            console.error("SOS incident status check failed:", error);
        } finally {
            checkingIncident = false;
        }
    }

    updateNotificationButton();
    checkIncidentStatus();
    setInterval(checkIncidentStatus, 2000);
})();
</script>

<script>

    /*
     * =========================================================
     * CONFIGURATION
     * =========================================================
     */

    const CLOUDFLARE_URL =
        "https://improve-outline-surge-cornell.trycloudflare.com";


    /*
     * =========================================================
     * ELEMENTS
     * =========================================================
     */

    const cameraVideo =
        document.getElementById("cameraVideo");

    const cameraStatus =
        document.getElementById("cameraStatus");

    const piAudio =
        document.getElementById("piAudio");

    const listenButton =
        document.getElementById("listenButton");

    const talkButton =
        document.getElementById("talkButton");


    /*
     * =========================================================
     * CONNECTION VARIABLES
     * =========================================================
     */

    let cameraPC = null;
    let piMicPC = null;
    let talkPC = null;

    let localMicStream = null;

    let isTalking = false;
    let isListening = false;

    
const driverSelect = document.getElementById("driverSelect");

function updateDriverDropdown(isActive) {
    const driverOption = driverSelect.querySelector(
        'option[value="driver1"]'
    );

    if (isActive && !driverOption) {
        const option = document.createElement("option");
        option.value = "driver1";
        option.textContent = "Driver 1";

        driverSelect.appendChild(option);
        driverSelect.options[0].textContent = "Select a driver";
    }

    if (!isActive && driverOption) {
        // Reset selection before removing the driver.
        driverSelect.value = "";
        driverOption.remove();
        driverSelect.options[0].textContent = "No active SOS";
    }

    if (!isActive) {
        driverSelect.value = "";
    }
}

driverSelect.addEventListener("change", () => {
    if (driverSelect.value === "driver1") {
        if (lastIncidentActive === true) {
            startCamera();
        } else {
            driverSelect.value = "";
            cameraStatus.textContent =
                "Camera unavailable — no active SOS";
        }
    } else {
        stopCamera();
    }
});



    /*
     * =========================================================
     * GENERIC WHEP FUNCTION
     *
     * Used for:
     *
     *     /cam/whep
     *     /mic/whep
     *
     * =========================================================
     */

    async function connectWHEP(path, mode, onTrack) {

        const pc = new RTCPeerConnection();

        pc.onconnectionstatechange = () => {

            console.log(
                path,
                "connection state:",
                pc.connectionState
            );

        };

        pc.oniceconnectionstatechange = () => {

            console.log(
                path,
                "ICE state:",
                pc.iceConnectionState
            );

        };

        pc.ontrack = onTrack;

        pc.addTransceiver(
            mode,
            {
                direction: "recvonly"
            }
        );

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(offer);


        /*
         * Wait for ICE gathering.
         */

        await waitForICE(pc);


        const response =
            await fetch(
                `${CLOUDFLARE_URL}${path}/whep`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/sdp"
                    },

                    body:
                        pc.localDescription.sdp
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                `${path}/whep returned ${response.status}: ${errorText}`
            );

        }


        const answerSdp =
            await response.text();


        await pc.setRemoteDescription(
            {
                type: "answer",
                sdp: answerSdp
            }
        );


        return pc;
    }


    /*
     * =========================================================
     * ICE GATHERING
     * =========================================================
     */

    function waitForICE(pc) {

        return new Promise(resolve => {

            if (pc.iceGatheringState === "complete") {

                resolve();
                return;

            }

            function checkState() {

                if (
                    pc.iceGatheringState === "complete"
                ) {

                    pc.removeEventListener(
                        "icegatheringstatechange",
                        checkState
                    );

                    resolve();

                }

            }

            pc.addEventListener(
                "icegatheringstatechange",
                checkState
            );

        });

    }


    /*
     * =========================================================
     * CAMERA
     *
     * Pi camera -> MediaMTX -> WebRTC -> browser
     *
     * Path:
     *
     *     /cam/whep
     *
     * =========================================================
     */


let cameraStartInProgress = false;
let cameraRequestId = 0;


async function startCamera() {
    if (cameraStartInProgress) return;

    if (cameraPC &&
        ["new", "connecting", "connected"].includes(
            cameraPC.connectionState
        )) {
        return;
    }

    cameraStartInProgress = true;
    const requestId = ++cameraRequestId;

    try {
        cameraStatus.textContent = "Checking SOS status...";

        const response = await fetch("/api/incident", {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "Incident API returned HTTP " + response.status
            );
        }

        const incident = await response.json();

        if (incident.active !== true) {
            cameraStatus.textContent =
                "Camera unavailable — no active SOS";
            return;
        }

        if (requestId !== cameraRequestId) return;

        cameraStatus.textContent = "Connecting to camera...";

        const pc = await connectWHEP(
            "/cam",
            "video",
            event => {
                // Do not reference pc here: this callback can run
                // before connectWHEP() returns the peer connection.
                if (requestId !== cameraRequestId) {
                    console.log("Ignoring obsolete camera track.");
                    return;
                }

                console.log("Camera track received:", event.track.kind);

                const stream = event.streams[0] ||
                    new MediaStream([event.track]);

                cameraVideo.srcObject = stream;

                cameraVideo.play().then(() => {
                    console.log(
                        "Camera playback started. Video dimensions:",
                        cameraVideo.videoWidth,
                        "x",
                        cameraVideo.videoHeight
                    );
                }).catch(err => {
                    console.error("Camera playback failed:", err);
                    cameraStatus.textContent =
                        "Connected, but video playback failed";
                });
            }
        );

        if (requestId !== cameraRequestId) {
            pc.close();
            return;
        }

        cameraPC = pc;
        cameraStatus.textContent = "Camera connected";

        console.log("Camera connected successfully");

    } catch (error) {
        if (requestId === cameraRequestId) {
            console.error("Camera connection failed:", error);
            cameraStatus.textContent = "Camera connection failed";
        }
    } finally {
        cameraStartInProgress = false;
    }
}


function pcIsObsolete(pc) {
    return pc.connectionState === "closed";
}


function stopCamera() {
    // Invalidate any camera connection attempt still in progress.
    cameraRequestId++;

    if (cameraPC) {
        cameraPC.close();
        cameraPC = null;
    }

    cameraVideo.pause();
    cameraVideo.srcObject = null;

    cameraStatus.textContent =
        "Camera disconnected — no active SOS";

    console.log("Camera disconnected because SOS is inactive.");

    
}



    /*
     * =========================================================
     * PI MICROPHONE -> WEBSITE
     *
     * Path:
     *
     *     /mic/whep
     *
     * =========================================================
     */

    listenButton.onclick =
        async function() {

            if (isListening) {

                stopPiMicrophone();

                return;

            }


            listenButton.disabled = true;

            listenButton.textContent =
                "Connecting...";


            try {

                piMicPC =
                    await connectWHEP(
                        "/mic",
                        "audio",

                        event => {

                            console.log(
                                "Pi microphone track received"
                            );

                            piAudio.srcObject =
                                event.streams[0];

                            piAudio.volume = 1.0;

                            piAudio.play()
                                .catch(err => {

                                    console.log(
                                        "Audio playback blocked:",
                                        err
                                    );

                                });

                        }
                    );


                isListening = true;

                listenButton.disabled = false;

                listenButton.textContent =
                    "Stop Pi Microphone";

                listenButton.classList.add(
                    "active-listen"
                );


                console.log(
                    "Pi microphone connected"
                );

            }

            catch (error) {

                console.error(
                    "Pi microphone connection failed:",
                    error
                );

                listenButton.disabled = false;

                listenButton.textContent =
                    "Pi Microphone Failed";

            }

        };


    /*
     * =========================================================
     * STOP PI MICROPHONE
     * =========================================================
     */

    function stopPiMicrophone() {

        if (piMicPC) {

            piMicPC.close();
            piMicPC = null;

        }

        piAudio.srcObject = null;

        isListening = false;

        listenButton.textContent =
            "Enable Pi Microphone";

        listenButton.classList.remove(
            "active-listen"
        );

    }


    /*
     * =========================================================
     * GET WEBSITE MICROPHONE
     * =========================================================
     */

    async function initLocalMic() {

        try {

            localMicStream =
                await navigator.mediaDevices.getUserMedia(
                    {
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        }
                    }
                );


            console.log(
                "Website microphone ready"
            );

        }

        catch (error) {

            console.error(
                "Microphone permission failed:",
                error
            );

            talkButton.disabled = true;

            talkButton.textContent =
                "Microphone Unavailable";

        }

    }


    /*
     * =========================================================
     * WEBSITE MICROPHONE -> PI SPEAKER
     *
     * Path:
     *
     *     /from_pc/whip
     *
     * =========================================================
     */

    talkButton.onclick =
        async function() {

            if (isTalking) {

                stopTalking();

                return;

            }


            if (!localMicStream) {

                await initLocalMic();

            }


            if (!localMicStream) {

                alert(
                    "Website microphone is unavailable."
                );

                return;

            }


            talkButton.disabled = true;

            talkButton.textContent =
                "Connecting...";


            try {

                talkPC =
                    new RTCPeerConnection();


                /*
                 * Send browser microphone
                 * to MediaMTX.
                 */

                localMicStream
                    .getTracks()
                    .forEach(track => {

                        talkPC.addTrack(
                            track,
                            localMicStream
                        );

                    });


                talkPC.onconnectionstatechange =
                    () => {

                        console.log(
                            "Talk connection:",
                            talkPC.connectionState
                        );

                    };


                const offer =
                    await talkPC.createOffer();


                await talkPC.setLocalDescription(
                    offer
                );


                await waitForICE(talkPC);


                const response =
                    await fetch(
                        `${CLOUDFLARE_URL}/from_pc/whip`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/sdp"
                            },

                            body:
                                talkPC.localDescription.sdp
                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        `WHIP returned ${response.status}: ${errorText}`
                    );

                }


                const answerSdp =
                    await response.text();


                await talkPC.setRemoteDescription(
                    {
                        type: "answer",
                        sdp: answerSdp
                    }
                );


                isTalking = true;

                talkButton.disabled = false;

                talkButton.textContent =
                    "Stop Talking";

                talkButton.classList.add(
                    "active-talk"
                );


                console.log(
                    "Website -> Pi audio connected"
                );

            }

            catch (error) {

                console.error(
                    "Talk connection failed:",
                    error
                );


                if (talkPC) {

                    talkPC.close();
                    talkPC = null;

                }


                isTalking = false;

                talkButton.disabled = false;

                talkButton.textContent =
                    "Connection Failed";


                setTimeout(() => {

                    if (!isTalking) {

                        talkButton.textContent =
                            "Click to Talk to Pi";

                    }

                }, 3000);

            }

        };


    /*
     * =========================================================
     * STOP TALKING
     * =========================================================
     */

    function stopTalking() {

        if (talkPC) {

            talkPC.close();
            talkPC = null;

        }


        isTalking = false;

        talkButton.textContent =
            "Click to Talk to Pi";

        talkButton.classList.remove(
            "active-talk"
        );

    }


    /*
     * =========================================================
     * START EVERYTHING
     * =========================================================
     */

    window.addEventListener(
        "load",
        async () => {

            console.log(
                "Starting Raspberry Pi surveillance system..."
            );


            /*
             * Start camera first.
             */

            await startCamera();


            /*
             * Ask browser for microphone permission.
             *
             * This does NOT start sending audio to Pi.
             */

            await initLocalMic();

        }
    );


    /*
     * =========================================================
     * CLEANUP
     * =========================================================
     */

    window.addEventListener(
        "beforeunload",
        () => {

            if (cameraPC)
                cameraPC.close();

            if (piMicPC)
                piMicPC.close();

            if (talkPC)
                talkPC.close();

            if (localMicStream) {

                localMicStream
                    .getTracks()
                    .forEach(track =>
                        track.stop()
                    );

            }

        }
    );

</script>

</body>
</html>
