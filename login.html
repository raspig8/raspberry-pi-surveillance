<div id="policeLoginScreen" style="
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
">
    <div style="
        width: 350px;
        max-width: 90%;
        padding: 30px;
        border-radius: 12px;
        background: #1e293b;
        text-align: center;
    ">
        <h2>Police Officer Login</h2>
        <p>Emergency Surveillance System</p>

        <form id="policeLoginForm">
            <input
                type="text"
                placeholder="Enter username"
                required
                style="width:100%;box-sizing:border-box;padding:12px;margin:10px 0;"
            >

            <input
                type="password"
                placeholder="Enter password"
                required
                style="width:100%;box-sizing:border-box;padding:12px;margin:10px 0;"
            >

            <button type="submit" style="
                width:100%;
                padding:12px;
                margin-top:10px;
                background:#2563eb;
                color:white;
                border:none;
                border-radius:6px;
                cursor:pointer;
                font-size:16px;
            ">Login</button>
        </form>
    </div>
</div>

<script>
    document.getElementById("policeLoginForm").addEventListener("submit", function(event) {
        event.preventDefault();
        document.getElementById("policeLoginScreen").style.display = "none";
